# Ground truth for PyGoat at 19d17cc, scoped to introduction/. One entry per lab
# whose code contains the flaw, located by hand; line ranges cover the handler
# from its source to its sink. Labs whose flaw lives only in templates,
# settings or business logic (broken access control, auth labs) are listed
# under scope "other" or omitted when no code line carries the flaw.
target: pygoat
entries:
  - id: pg-xss-lab1
    cwe: CWE-79
    vulnerable: true
    scope: taint
    locations: [{file: introduction/views.py, lines: [93, 101]}]
    note: q is rendered with |safe in Lab/XSS/xss_lab.html

  - id: pg-xss-lab2
    cwe: CWE-79
    vulnerable: true
    scope: taint
    locations: [{file: introduction/views.py, lines: [106, 118]}]
    note: only <script> tags are stripped; template renders username|safe

  - id: pg-xss-lab3
    cwe: CWE-79
    vulnerable: true
    scope: taint
    locations: [{file: introduction/views.py, lines: [122, 133]}]
    note: alphanumerics removed, value placed in a script context (JSFuck payloads)

  - id: pg-sqli-lab
    cwe: CWE-89
