# Generated by python -m vulnscan.rl.corpus. Training only; never evaluated on.
targets:
- name: benchmarkpython
  lang: python
  path: training/data/benchmarkpython
  scan_paths:
  - testcode
  pysa_sources:
  - .
  pysa_deps:
  - flask==1.1.4
  - werkzeug==1.0.1
  - jinja2==2.11.3
  - markupsafe==1.1.1
  - itsdangerous==1.1.0
  - click==7.1.2
  - lxml
  - pyyaml
  - requests
  - ldap3
- name: sard-php
  lang: php
  path: training/data/sard-php
- name: xvwa
  lang: php
  path: training/data/xvwa
  scan_paths:
  - vulnerabilities
- name: django.nv
  lang: python
  path: training/data/django.nv
  scan_paths:
  - taskManager
  pysa_sources:
  - .
  pysa_deps:
  - django<2
- name: vulpy
  lang: python
  path: training/data/vulpy
  pysa_sources:
  - .
  pysa_deps:
  - flask==1.1.4
  - werkzeug==1.0.1
  - jinja2==2.11.3
  - markupsafe==1.1.1
  - itsdangerous==1.1.0
  - click==7.1.2
