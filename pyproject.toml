[project]
name = "vulnscan"
version = "0.1.0"
description = "LLM-assisted vulnerability scanner: Semgrep + Pysa findings triaged by a local LLM"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vulnscan = "vulnscan.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vulnscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
